name: Dependency refresh (temporary)

on:
  push:
    branches: [chore/security-dependency-refresh]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/security-dependency-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): regenerate npm lockfile"
            git push origin HEAD:chore/security-dependency-refresh
          fi
      - name: Clean install
        run: npm ci
      - name: Security audit
        id: audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:x.title)}))},null,2))"
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://radioeterna.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-for-deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: npm-audit.json
          if-no-files-found: ignore
